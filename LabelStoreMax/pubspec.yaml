# Official WooSignal App Template for WooCommerce

# Label StoreMax
# Version: 8.2.7
# Author: Anthony Gordon
# Homepage: https://woosignal.com
# Documentation: https://woosignal.com/docs/app/label-storemax

### Change App Icon
# 1 Replace: assets/app_icon/appicon.png (1024px1024px icon size)
# 2 Run this command from the terminal: "dart run flutter_launcher_icons:main"

### Uploading the IOS/Android app
# IOS https://flutter.dev/docs/deployment/ios
# Android https://flutter.dev/docs/deployment/android

name: flutter_app
description: Label StoreMax

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  google_fonts: ^8.2.1
  intl: ^0.20.3
  nylo_framework: ^7.1.30
  woosignal: ^4.5.0
  # 5.x requires the WP JSON API WordPress plugin 5.0+ (`wpapp/v4` API).
  wp_json_api: ^5.0.2
  cached_network_image: ^4.0.0
  package_info_plus: ^10.2.1
  flutter_inappwebview: ^6.1.5
  pull_to_refresh_flutter3: 2.0.2
  bubble_tab_indicator: ^0.1.6
  math_expressions: ^3.2.0
  validated: ^2.0.0
  flutter_spinkit: ^5.2.2
  auto_size_text: ^3.0.0
  html: ^0.15.7
  flutter_widget_from_html_core: ^0.17.4
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_swiper_view: ^1.1.8
  firebase_messaging: ^16.6.0
  firebase_core: ^4.14.0
  collection: ^1.19.1
  flutter_stripe: ^14.0.0
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

dev_dependencies:
  vibe_check: ^1.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# APP ICON
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/appicon.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/
    - assets/json/
    - assets/images/
    - lang/
